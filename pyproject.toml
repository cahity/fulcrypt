[project]
name = "fulcrypt"
version = "0.1.0"
description = "Cryptography primitives implemented from scratch for learning (not for real-world use)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Y. Cahit Yıldırım" }]
requires-python = ">=3.14"
dependencies = []
keywords = ["cryptography", "aes", "finite-fields", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Private :: Do Not Upload",
]

[project.urls]
Repository = "https://github.com/cahity/fulcrypt"

[build-system]
requires = ["uv_build>=0.9.10,<0.10"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 1
timeout_method = "thread"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle: PEP 8 errors and warnings
    "F",        # pyflakes: unused imports, undefined names
    "I",        # isort: import sorting
    "D",        # pydocstyle: docstrings
    "N",        # pep8-naming
    "UP",       # pyupgrade: modern Python syntax
    "B",        # flake8-bugbear: likely bugs
]

ignore = [
    "D105",     # dunder methods: the operator says what they do
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pep8-naming]
# Math notation: class factories return classes (CamelCase), F/R are fields/rings, Zn is Z/nZ.
ignore-names = ["ZMod", "GF2n", "F", "R", "Z*", "*_Z[0-9]*"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]          # test names describe themselves

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
files = ["src/fulcrypt", "examples"]
check_untyped_defs = true
warn_unused_ignores = true
